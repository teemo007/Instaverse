<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Kapsule</title>
    <meta name="description" content="Kapsule — a time capsule for your moments." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved or system color scheme before first paint to avoid a flash.
      (function () {
        var scheme = "light";
        try {
          var stored = localStorage.getItem("kapsule:color-scheme");
          if (stored === "light" || stored === "dark") scheme = stored;
          else if (matchMedia("(prefers-color-scheme: dark)").matches) scheme = "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = scheme;
        if (scheme === "dark") {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#0a0a14");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
